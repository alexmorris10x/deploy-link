name: DeployLinkCompanion

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "98CDQPW36W"
    CODE_SIGN_STYLE: Automatic

targets:
  DeployLinkCompanion:
    type: application
    platform: iOS
    sources:
      - path: DeployLinkCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.deploylink
        INFOPLIST_FILE: DeployLinkCompanion/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
    info:
      path: DeployLinkCompanion/Info.plist
      properties:
        CFBundleDisplayName: Deploy Link
        CFBundleName: DeployLinkCompanion
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false

schemes:
  DeployLinkCompanion:
    build:
      targets:
        DeployLinkCompanion: all
    run:
      config: Debug
    archive:
      config: Release
