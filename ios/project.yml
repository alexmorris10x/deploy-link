name: XcodeCellularProbe

options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "98CDQPW36W"
    CODE_SIGN_STYLE: Automatic

targets:
  XcodeCellularProbe:
    type: application
    platform: iOS
    sources:
      - path: XcodeCellularProbe
    settings:
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: DevAssets.xcassets
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.xcodecellularprobe
        INFOPLIST_FILE: XcodeCellularProbe/Info.plist
        CODE_SIGN_ENTITLEMENTS: XcodeCellularProbe/XcodeCellularProbe.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
    dependencies:
      - target: XcodeCellularTunnel
        embed: true
    entitlements:
      path: XcodeCellularProbe/XcodeCellularProbe.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: XcodeCellularProbe/Info.plist
      properties:
        CFBundleDisplayName: Xcode Cellular Probe
        CFBundleName: XcodeCellularProbe
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: This prototype checks for the Apple developer pairing service on this iPhone.
        ITSAppUsesNonExemptEncryption: false

  XcodeCellularTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: XcodeCellularTunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.xcodecellularprobe.Tunnel
        INFOPLIST_FILE: XcodeCellularTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: XcodeCellularTunnel/XcodeCellularTunnel.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
    entitlements:
      path: XcodeCellularTunnel/XcodeCellularTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
    info:
      path: XcodeCellularTunnel/Info.plist
      properties:
        CFBundleDisplayName: Xcode Cellular Tunnel
        CFBundleName: XcodeCellularTunnel
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PacketTunnelProvider"

schemes:
  XcodeCellularProbe:
    build:
      targets:
        XcodeCellularProbe: all
        XcodeCellularTunnel: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
