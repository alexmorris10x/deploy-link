name: DeployLinkReviewSample

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  DeployLinkReviewSample:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ReviewSampleApp.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.deploylink.reviewsample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Deploy Link Sample
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  DeployLinkReviewSample:
    build:
      targets:
        DeployLinkReviewSample: all
    run:
      config: Debug
    archive:
      config: Release
