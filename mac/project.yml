name: DeployLinkMac
options:
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "98CDQPW36W"
    CODE_SIGN_STYLE: Automatic
targets:
  DeployLinkMac:
    type: application
    platform: macOS
    sources:
      - path: DeployLinkMac
      - path: Resources/mac_control.py
        buildPhase: resources
      - path: ../ota
        type: folder
        buildPhase: resources
      - path: ../scripts
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Deploy Link
        PRODUCT_BUNDLE_IDENTIFIER: com.10x.deploylink.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Deploy Link checks the private build queue running on this Mac.
    scheme:
      gatherCoverageData: false
